name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build site
        run: npm run build
        env:
          PUBLIC_SITE_URL: ${{ secrets.PUBLIC_SITE_URL || 'https://yourusername.github.io/Mahanaim-Chirstian-Church' }}
          PUBLIC_CANONICAL_DOMAIN: ${{ secrets.PUBLIC_CANONICAL_DOMAIN || '' }}
          PUBLIC_UMAMI_WEBSITE_ID: ${{ secrets.PUBLIC_UMAMI_WEBSITE_ID || '' }}
          PUBLIC_UMAMI_SCRIPT_URL: ${{ secrets.PUBLIC_UMAMI_SCRIPT_URL || 'https://analytics.umami.is/script.js' }}
          PUBLIC_BIBLE_API_KEY: ${{ secrets.PUBLIC_BIBLE_API_KEY || '' }}
          PUBLIC_YOUTUBE_PLAYLIST_ID: ${{ secrets.PUBLIC_YOUTUBE_PLAYLIST_ID || '' }}
          PUBLIC_YOUTUBE_CHANNEL_URL: ${{ secrets.PUBLIC_YOUTUBE_CHANNEL_URL || 'https://www.youtube.com/@MahanamiChurch' }}
          PUBLIC_CHURCH_LAT: ${{ secrets.PUBLIC_CHURCH_LAT || '40.7128' }}
          PUBLIC_CHURCH_LNG: ${{ secrets.PUBLIC_CHURCH_LNG || '-74.0060' }}
          PUBLIC_CHURCH_ADDRESS: ${{ secrets.PUBLIC_CHURCH_ADDRESS || '123 Faith Avenue, City, State 00000' }}
          PUBLIC_CHURCH_EMAIL: ${{ secrets.PUBLIC_CHURCH_EMAIL || 'info@mahanaim.org' }}
          PUBLIC_CHURCH_PHONE: ${{ secrets.PUBLIC_CHURCH_PHONE || '+1 (000) 000-0000' }}
          PUBLIC_FORMSPREE_ENDPOINT: ${{ secrets.PUBLIC_FORMSPREE_ENDPOINT || 'https://formspree.io/f/mnjokoon' }}

      - name: Upload artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
